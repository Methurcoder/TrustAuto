[package]
name = "trustauto"
version = "1.0.0-preview.1"
edition = "2021"
description = "Non-resident, policy-bounded automatic privilege elevation for Linux shells"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
indexmap = { version = "2", features = ["serde"] }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Exact float parsing, so features read back from the facts index equal the computed ones.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
